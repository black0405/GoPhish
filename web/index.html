<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phishing Report — test UI</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Serif+Display&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5"/><path d="M3 12c0 1.7 4 3 9 3s9-1.3 9-3"/></svg>
      </div>
      <div>
        <h1>Phishing Report</h1>
        <div class="sub">test UI</div>
      </div>
    </div>
    <div class="top-right">
      <span class="srv" id="srv">checking…</span>
      <button class="ghost-btn" id="reset-btn">Reset</button>
    </div>
  </header>

  <div class="error-banner" id="offline-banner" hidden>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    <span id="offline-why">Server not reachable.</span>
  </div>

  <div class="stage" style="grid-template-columns:380px 1fr">
    <section class="panel">
      <div class="panel-inner">
        <div class="view collector">
          <div class="st-head"><h2 class="st-title"><small>step 1</small>Source files</h2></div>
          <p class="sop-purpose" style="padding:8px 0 14px">Only the Userbase file is required. Leave any other out and its step is skipped.</p>
          <div class="drops" id="drops"></div>
          <div class="load-foot">
            <button class="btn primary wide" id="run-btn" disabled>Run pipeline</button>
          </div>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="busybar" id="busybar"><i></i></div>
      <div class="panel-inner" id="results"></div>
    </section>
  </div>
</div>

<div class="toast-wrap" id="toasts" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
